name: Build and Release PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v4
        with:
          root_file: book.tex
          latexmk_use_lualatex: true
          os: debian
          pre_compile: |
            tlmgr install libertinus libertinus-fonts || tlmgr install libertinus-fonts
            luaotfload-tool --force --update
            kpsewhich HaranoAjiMincho-Regular.otf || true
            kpsewhich LibertinusSerif-Regular.otf || true
            kpsewhich LibertinusMath-Regular.otf || true
            luaotfload-tool --find="Libertinus Serif" || true
            luaotfload-tool --find="Libertinus Math" || true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book.pdf
          path: book.pdf

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: book.pdf
          name: Release ${{ github.ref_name }}
          body: |
            数値計算の品質保証法 ${{ github.ref_name }}
