name: Build and Release PDF

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PDF in TeX Live container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/xu-cheng/texlive-debian:latest \
            bash -lc '
              set -eux

              export PATH="/opt/texlive/texdir/bin/x86_64-linux:$PATH"

              kpsewhich HaranoAjiMincho-Regular.otf
              kpsewhich LibertinusSerif-Regular.otf
              kpsewhich LibertinusMath-Regular.otf
              luaotfload-tool --force --update

              latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode book.tex
            '

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: book.pdf

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" book.pdf \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
