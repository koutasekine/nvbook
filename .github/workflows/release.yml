name: Build and Release PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/being24/latex-docker:latest

    steps:
      - uses: actions/checkout@v4

      - name: Check fonts
        run: |
          lualatex --version
          kpsewhich HaranoAjiMincho-Regular.otf || true
          kpsewhich LibertinusSerif-Regular.otf || true
          kpsewhich LibertinusMath-Regular.otf || true
          luaotfload-tool --find="Libertinus Serif" || true
          luaotfload-tool --find="Libertinus Math" || true

      - name: Build PDF
        run: |
          luaotfload-tool --force --update
          lualatex -interaction=nonstopmode -halt-on-error book.tex
          if grep -q '\\citation' book.aux; then
            bibtex book
            lualatex -interaction=nonstopmode -halt-on-error book.tex
            lualatex -interaction=nonstopmode -halt-on-error book.tex
          else
            lualatex -interaction=nonstopmode -halt-on-error book.tex
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book.pdf
          path: book.pdf

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: book.pdf
          name: Release ${{ github.ref_name }}
          body: |
            数値計算の品質保証法 ${{ github.ref_name }}
