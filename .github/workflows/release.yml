name: Build and Release PDF

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build PDF in TeX Live container
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/xu-cheng/texlive-debian:latest \
            bash -lc '
              set -eux
              tlmgr option repository https://mirror.ctan.org/systems/texlive/tlnet
              tlmgr update --self
              tlmgr install libertinus libertinus-fonts
              luaotfload-tool --force --update
              kpsewhich HaranoAjiMincho-Regular.otf
              kpsewhich LibertinusSerif-Regular.otf
              kpsewhich LibertinusMath-Regular.otf
              luaotfload-tool --find="Libertinus Serif"
              luaotfload-tool --find="Libertinus Math"
              latexmk -lualatex -file-line-error -halt-on-error -interaction=nonstopmode book.tex
            '

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: book.pdf
          path: book.pdf

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: book.pdf
          name: Release ${{ github.ref_name }}
          body: |
            数値計算の品質保証法 ${{ github.ref_name }}
